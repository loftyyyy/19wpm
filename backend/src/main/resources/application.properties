spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/typing_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# IMPORTANT: since Flyway controls schema, do NOT let Hibernate create tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Rate Limiting
security.rate-limit.login.attempts=5
security.rate-limit.login.window=60

security.rate-limit.refresh.attempts=10
security.rate-limit.refresh.window=60

security.rate-limit.max-buckets=100000


# Token Security
security.token-cleanup.enabled=true
security.token-cleanup.retention-hours=2
security.token-cleanup.interval=3600000

# JWT Token
jwt.access-token.expiration-ms=90000
jwt.refresh-token.expiration-ms=604800000